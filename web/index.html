<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReMynder</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

      --bg: #000000;
      --surface: #1c1c1e;
      --menu-bg: #2c2c2e;
      --menu-highlight: #3a3a3c;
      --border: rgba(84,84,88,0.65);
      --border-md: #38383a;
      --border-card: var(--border-md);
      /* Texto: se deriva del fondo, no del componente — neutro→primario, translúcido→secundario, acento→máx. contraste */
      --text: #ebebf5;
      --muted: #ebebf599;
      --subtle: rgba(235,235,245,0.3);
      --fill: rgba(120,120,128,0.32);
      /* Acento — ÚNICO token de marca. Cambiarlo acá y en el bloque light alcanza para toda la UI. */
      --accent: #40c8e0;
      --accent-fill: color-mix(in srgb, var(--accent) 18%, transparent);
      /* #40c8e0 es un teal claro — texto blanco encima no alcanza contraste. Va oscuro. */
      --accent-contrast: #00252b;
      --radius: 10px;
      --radius-sm: 8px;
      --radius-pill: 999px;

      /* Categoría — mapeo fijo por nombre (ver seedCategories): p0 karate, p1 facultad,
         p2 antel, p3 salud, p4 personal, p5 padres. Solo viven en dots de 6-8px. */
      --p0: #ff9f0a;
      --p1: #30d158;
      --p2: #0a84ff;
      --p3: #ff375f;
      --p4: #bf5af2;
      --p5: #ffd60a;
      --p6: #73daca;
      --p7: #7dcfff;
      --p8: #2ac3de;
      --p9: #c0caf5;
      --salud: var(--p3);
    }

    html[data-theme="light"] {
      /* Fondo de página bajado: el blanco de las tarjetas necesita separarse del bg para dar jerarquía */
      --bg: #e9e9ec;
      --surface: #ffffff;
      --menu-bg: #ffffff;
      --menu-highlight: #f0f0f2;
      --border: rgba(60,60,67,0.29);
      --border-md: #dcdce0;
      /* Tarjetas: --border-md queda demasiado sutil sobre --surface blanco — las
         tarjetas necesitan un borde algo más marcado para distinguirse del fondo. */
      --border-card: #c7c7cc;
      /* Texto: se deriva del fondo, no del componente — neutro→primario, translúcido→secundario, acento→máx. contraste */
      --text: #1c1c1e;
      --muted: #3c3c43bf;
      --subtle: rgba(60,60,67,0.3);
      --fill: rgba(120,120,128,0.16);
      /* Acento — mismo token, valor calibrado para contraste AA sobre fondo claro. */
      --accent: #1e7f91;
      /* #1e7f91 es un teal oscuro — texto blanco encima sí alcanza contraste. */
      --accent-contrast: #ffffff;

      --p0: #ff9500;
      --p1: #34c759;
      --p2: #007aff;
      --p3: #ff2d55;
      --p4: #af52de;
      --p5: #ffcc00;
      --p6: #1a7a65;
      --p7: #1573a0;
      --p8: #127a6a;
      --p9: #3d4589;
      --salud: var(--p3);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Login screen ── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: var(--surface);
      border: 0.5px solid var(--border-md);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    .login-title {
      font-family: var(--font);
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    .login-sub {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
      justify-content: center;
    }

    .login-btn:hover { background: var(--fill); }

    /* ── Header ── */
    header {
      padding: 1.25rem 1.5rem 1.25rem;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    header h1 {
      font-family: var(--font);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--accent);
    }

    header h1 span { color: var(--muted); font-weight: 400; }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--font);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      font-size: 12px;
      font-family: var(--font);
      padding: 0;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.12s;
    }

    .logout-btn:hover { color: var(--accent); }

    /* ── Add row ── */
    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 0.875rem;
    }

    .add-row input {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: box-shadow 0.15s;
    }

    .add-row input::placeholder { color: var(--muted); }
    .add-row input:focus { box-shadow: 0 0 0 1.5px var(--accent); }

    /* Hijo directo, no descendiente: si no, esto también capturaría los botones
       anidados del selector de categoría (.cat-select-btn, .cat-menu-item), que
       viven dentro de .input-wrap dentro de .add-row, y les pintaría el acento. */
    .add-row > button {
      height: 40px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-contrast);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .add-row > button:hover { opacity: 0.85; }

    /* ── Selector de categoría (patrón Recordatorios iOS): control dentro del input ── */
    .input-wrap {
      position: relative;
      flex: 1;
    }

    .input-wrap input {
      width: 100%;
      padding-right: 172px;
    }

    .cat-select-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 96px;
      max-width: 152px;
      padding: 6px 8px;
      border: none;
      border-radius: var(--radius-sm);
      background: none;
      font-family: var(--font);
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.12s;
    }
    .cat-select-btn:hover { background: var(--fill); }

    /* Con categoría elegida: texto primario, como un valor — no un placeholder */
    .cat-select-btn.has-value { color: var(--text); }

    .cat-select-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--subtle);
      flex-shrink: 0;
    }

    #cat-select-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Color propio, independiente del label: el chevron queda siempre secundario,
       aunque .has-value ponga el nombre en texto primario. */
    .cat-select-chevron { flex-shrink: 0; color: var(--muted); }

    .cat-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 170px;
      background: var(--menu-bg);
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      padding: 6px;
      z-index: 20;
    }

    .cat-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 10px;
      border: none;
      border-radius: var(--radius-sm);
      background: none;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 0.12s;
    }
    .cat-menu-item:hover { background: var(--fill); }

    /* Ítem seleccionado: highlight neutro sutil — el acento marca la selección
       vía el checkmark, no pinta la fila. */
    .cat-menu-item.selected { background: var(--menu-highlight); }
    .cat-menu-item.selected:hover { background: var(--menu-highlight); }

    .cat-menu-name { flex: 1; }
    .cat-menu-check { color: var(--accent); flex-shrink: 0; }

    .cat-menu-empty {
      padding: 10px;
      font-size: 13px;
      font-family: var(--font);
      color: var(--muted);
    }

    /* El color de categoría vive SOLO en el dot y en el badge — nunca en píldoras de filtro (nav) */
    .cat-select-dot.cat-p0, .badge.cat-p0::before, .cat-dot.cat-p0, .color-dot.cat-p0 { background: var(--p0); }
    .cat-select-dot.cat-p1, .badge.cat-p1::before, .cat-dot.cat-p1, .color-dot.cat-p1 { background: var(--p1); }
    .cat-select-dot.cat-p2, .badge.cat-p2::before, .cat-dot.cat-p2, .color-dot.cat-p2 { background: var(--p2); }
    .cat-select-dot.cat-p3, .badge.cat-p3::before, .cat-dot.cat-p3, .color-dot.cat-p3 { background: var(--p3); }
    .cat-select-dot.cat-p4, .badge.cat-p4::before, .cat-dot.cat-p4, .color-dot.cat-p4 { background: var(--p4); }
    .cat-select-dot.cat-p5, .badge.cat-p5::before, .cat-dot.cat-p5, .color-dot.cat-p5 { background: var(--p5); }
    .cat-select-dot.cat-p6, .badge.cat-p6::before, .cat-dot.cat-p6, .color-dot.cat-p6 { background: var(--p6); }
    .cat-select-dot.cat-p7, .badge.cat-p7::before, .cat-dot.cat-p7, .color-dot.cat-p7 { background: var(--p7); }
    .cat-select-dot.cat-p8, .badge.cat-p8::before, .cat-dot.cat-p8, .color-dot.cat-p8 { background: var(--p8); }
    .cat-select-dot.cat-p9, .badge.cat-p9::before, .cat-dot.cat-p9, .color-dot.cat-p9 { background: var(--p9); }

    nav {
      display: flex;
      gap: 6px;
      padding: 0.75rem 1.5rem;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      overflow-x: auto;
      align-items: center;
    }

    nav::-webkit-scrollbar { display: none; }

    /* Píldoras de filtro (estado, incluye categoría): mono-color — el color es SIEMPRE
       el acento si está activa, fill translúcido si no. Nunca color de categoría.
       Fondo translúcido → texto secundario (regla de color por fondo). */
    .nav-btn {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--fill);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font);
      transition: all 0.12s;
    }

    .nav-btn:not(.active):hover { opacity: 0.7; }

    .nav-btn.active {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .sep { width: 1px; height: 16px; background: var(--border-md); margin: 0 4px; flex-shrink: 0; }

    main { padding: 1.5rem 1.5rem 5rem; max-width: 680px; margin: 0 auto; }
    main.board-mode { max-width: none; padding: 0; }

    .empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--font);
    }

    /* Tarjeta: fondo elevado, hairline, sin sombra, sobre fondo gris de sistema */
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 0.5px solid var(--border-card);
      border-radius: var(--radius);
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }

    .task-item.done { opacity: 0.5; }

    .check-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border-md);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: transparent;
    }

    .check-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-contrast);
    }

    .check-btn svg { width: 12px; height: 12px; }

    .task-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--subtle);
    }

    /* Badge de categoría: dot de 6px + label en minúscula, texto siempre neutro */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      flex-shrink: 0;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--subtle);
      flex-shrink: 0;
    }

    .del-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      transition: all 0.12s;
    }

    .del-btn:hover { color: var(--accent); }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.75rem 1.5rem 0.5rem;
      background: var(--surface);
      border-top: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-attr {
      font-size: 10px;
      color: var(--accent);
      text-align: center;
    }

    .footer-link {
      color: inherit;
      text-decoration: none;
    }

    .footer-link:hover { color: var(--muted); }

    .clear-btn {
      font-size: 12px;
      font-family: var(--font);
      padding: 0;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      display: none;
      transition: color 0.12s;
    }

    .clear-btn:hover { color: var(--accent); }

    .theme-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      transition: color 0.12s;
    }
    .theme-btn:hover { color: var(--accent); }

    /* ── Settings screen ── */
    #settings-screen { min-height: 100vh; display: flex; flex-direction: column; }
    #settings-screen .header-top { margin-bottom: 0; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-family: var(--font);
      padding: 0;
      border: none;
      background: none;
      color: var(--accent);
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .back-btn:hover { opacity: 0.7; }

    .settings-title {
      font-family: var(--font);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
    }

    .settings-main {
      padding: 2rem 1.5rem 5rem;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    .settings-section-title {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Category rows: una sola tarjeta agrupada, filas separadas por hairline ── */
    #categories-list {
      background: var(--surface);
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius);
      padding: 0 16px;
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 0.5px solid var(--border);
      flex-wrap: wrap;
    }
    #categories-list .cat-row:last-child { border-bottom: none; }

    .cat-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-name {
      flex: 1;
      font-size: 15px;
      font-family: var(--font);
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cat-row-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      transition: all 0.12s;
    }
    .icon-btn:hover { color: var(--accent); }
    .icon-btn.blocked { opacity: 0.25; cursor: not-allowed; pointer-events: none; }

    .confirm-btn { color: var(--accent); }
    .confirm-btn:hover { opacity: 0.7; }

    .cat-blocked-msg {
      width: 100%;
      font-size: 12px;
      font-family: var(--font);
      color: var(--muted);
      padding-left: 18px;
      padding-bottom: 2px;
    }

    .cat-error {
      width: 100%;
      font-size: 12px;
      font-family: var(--font);
      color: var(--p3);
      padding-top: 4px;
    }

    /* ── Inline form ── */
    .cat-row-form {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--border);
      flex-wrap: wrap;
    }

    .cat-form-input {
      flex: 1;
      min-width: 140px;
      height: 36px;
      padding: 0 12px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: box-shadow 0.15s;
    }
    .cat-form-input::placeholder { color: var(--muted); }
    .cat-form-input:focus { box-shadow: 0 0 0 1.5px var(--accent); }

    /* ── Color picker ── */
    .color-picker {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      padding: 6px 0 2px;
    }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .color-dot:hover { transform: scale(1.12); }
    .color-dot.selected { border-color: var(--accent); transform: scale(1.2); }

    /* ── Settings footer area ── */
    .settings-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--font);
    }

    .add-cat-btn {
      margin-top: 1.5rem;
      height: 44px;
      padding: 0 20px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--accent);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      width: 100%;
    }
    .add-cat-btn:hover { opacity: 0.7; }

    /* ── Board ── */
    .board {
      display: flex;
      gap: 16px;
      padding: 1.5rem 1.5rem 5rem;
      align-items: flex-start;
      min-height: calc(100vh - 180px);
    }

    .board-col {
      flex-grow: 1;
      flex-shrink: 1;
      flex-basis: 0;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      transition: flex-grow 0.2s, background 0.15s, border-color 0.15s;
    }

    /* Columna vacía: siempre visible, zona de drop descubrible aunque no tenga contenido */
    .board-col.empty-col {
      border: 1.5px dashed var(--border-md);
      padding: 12px;
    }

    /* Al arrastrar, las tres columnas se igualan en ancho — el destino manda, no el contenido */
    .board.dragging-active .board-col { flex-grow: 1 !important; }

    .board-col.drag-over {
      background: var(--accent-fill);
      border-color: var(--accent);
    }

    .board-col-header {
      padding: 4px 0 10px;
      border-bottom: 0.5px solid var(--border);
      font-family: var(--font);
      font-weight: 500;
      color: var(--accent);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .board-col-count { color: var(--muted); font-size: 11px; position: absolute; right: 0; }

    .board-col-body {
      flex: 1;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 80px;
    }

    .board-card {
      background: var(--surface);
      border: 0.5px solid var(--border-card);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.2s;
      user-select: none;
    }

    .board-card:active { cursor: grabbing; }
    .board-card.dragging { opacity: 0.5; box-shadow: 0 0 0 2px var(--accent); }

    .board-card-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
    }

    .board-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .board-card-actions {
      display: none;
      gap: 3px;
    }

    .board-card-move-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      flex-shrink: 0;
      padding: 0;
    }

    .board-card-move-btn:hover { color: var(--accent); }
    .board-card-move-btn:disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }

    .board-card-del-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      transition: all 0.12s;
      padding: 0;
    }

    .board-card-del-btn:hover { color: var(--accent); }

    .board-dots {
      display: none;
      justify-content: center;
      gap: 7px;
      padding: 10px 0 0;
    }

    .board-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--subtle);
      transition: background 0.2s;
      cursor: pointer;
    }

    .board-dot.active { background: var(--accent); }

    .board-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font);
    }

    /* Sin tareas visibles en ninguna columna: un mensaje, no 3 drop zones sin sentido */
    .board-empty-filter {
      width: 100%;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--font);
    }

    /* Contenedor centrado del área de contenido en monitores anchos. Header (barra
       superior) y footer se dejan afuera a propósito — siguen a ancho completo,
       con su contenido anclado a los bordes de la ventana (patrón Apple). El
       padding lateral de 24px ya lo aportan header/nav/.board por su cuenta, así
       que solo hace falta acotar el ancho y centrar — sin tocar nada por debajo
       de 1200px. */
    @media (min-width: 1200px) {
      .add-row,
      nav,
      .board {
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    @media (max-width: 640px) {
      .board {
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        padding: 1.5rem 0 5rem;
        gap: 0;
        overflow-x: auto;
      }

      .board-col {
        flex-shrink: 0;
        width: calc(100vw - 3rem);
        margin: 0 0.75rem;
        scroll-snap-align: start;
      }

      .board-col:first-child { margin-left: 1.5rem; }
      .board-col:last-child  { margin-right: 1.5rem; }

      .board-dots { display: flex; }

      .board-card-actions { display: flex; }
    }
  </style>
</head>

<script type="module">
import { initializeApp }                                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
                                                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, setDoc, onSnapshot, query, orderBy, writeBatch }
                                                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAQM7IW_7XxpCXTJFDZGxUJye8M27O-8zc",
  authDomain: "pendientes-2c0ea.firebaseapp.com",
  projectId: "pendientes-2c0ea",
  storageBucket: "pendientes-2c0ea.firebasestorage.app",
  messagingSenderId: "656621685090",
  appId: "1:656621685090:web:029c4da97c27a805b0843b"
};

const app     = initializeApp(firebaseConfig);
const auth    = getAuth(app);
const db      = getFirestore(app);

// UID del usuario admin — reemplazar con el UID real de Firebase Auth
const ADMIN_UID = '8qmjq5cwYoYb3MyiGWCkHLUhvG22';

let tasks           = [];
let categories      = [];
let filter          = 'all';
let catFilter       = null;
let selectedCat     = null;
let unsubTasks      = null;
let unsubCats       = null;
let categoriesReady = false;
let editingCatId    = null;
let viewMode           = localStorage.getItem('viewMode') || 'list';
let dragTaskId         = null;
let boardDndController = null;
let dotsController     = null;
let catMenuOpen        = false;

// ── Handle redirect result on page load ─────────────────────────
getRedirectResult(auth).catch(err => {
  if (err.code && err.code !== 'auth/no-auth-event') {
    console.error('Redirect error:', err.code, err.message);
    const sub = document.getElementById('login-sub');
    sub.textContent = `Error: ${err.code}`;
    sub.style.color = 'var(--salud)';
  }
});

// ── Auth state ──────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('user-avatar').src = user.photoURL || '';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('new-task').focus();
    startListeners(user.uid);
  } else {
    document.getElementById('login-screen').style.display = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('settings-screen').style.display = 'none';
    if (unsubTasks) { unsubTasks(); unsubTasks = null; }
    if (unsubCats)  { unsubCats();  unsubCats  = null; }
    tasks           = [];
    categories      = [];
    selectedCat     = null;
    categoriesReady = false;
    editingCatId    = null;
  }
});

function startListeners(uid) {
  if (unsubTasks) unsubTasks();
  if (unsubCats)  unsubCats();

  // Listener: categorías
  const qCats = query(collection(db, 'users', uid, 'categories'), orderBy('createdAt'));
  unsubCats = onSnapshot(qCats, snap => {
    categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!categoriesReady && categories.length === 0) seedCategories(uid);
    categoriesReady = true;
    if (selectedCat === null && categories.length > 0) selectedCat = categories[0].id;
    renderCatSelector();
    renderNavCats();
    render();
    if (document.getElementById('settings-screen')?.style.display !== 'none') renderSettings();
  });

  // Listener: tareas
  const qTasks = query(collection(db, 'users', uid, 'tasks'), orderBy('createdAt'));
  unsubTasks = onSnapshot(qTasks, snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    if (document.getElementById('settings-screen')?.style.display !== 'none') renderSettings();
  });
}

async function seedCategories(uid) {
  try {
    if (uid === ADMIN_UID) {
      // Seed admin (m4verick): IDs explícitos para cero migración de tareas existentes
      const adminCats = [
        { id: 'karate',   name: 'karate',   colorIndex: 0 },
        { id: 'facultad', name: 'facultad', colorIndex: 1 },
        { id: 'antel',    name: 'antel',    colorIndex: 2 },
        { id: 'salud',    name: 'salud',    colorIndex: 3 },
        { id: 'personal', name: 'personal', colorIndex: 4 },
        { id: 'padres',   name: 'padres',   colorIndex: 5 },
      ];
      for (const cat of adminCats) {
        await setDoc(
          doc(db, 'users', uid, 'categories', cat.id),
          { name: cat.name, colorIndex: cat.colorIndex, createdAt: Date.now() },
          { merge: true }
        );
      }
    } else {
      // Seed usuarios nuevos: 2 categorías de ejemplo editables
      await addDoc(collection(db, 'users', uid, 'categories'), {
        name: 'trabajo', colorIndex: 0, createdAt: Date.now()
      });
      await addDoc(collection(db, 'users', uid, 'categories'), {
        name: 'personal', colorIndex: 4, createdAt: Date.now() + 1
      });
    }
  } catch (err) {
    console.error('seedCategories error:', err);
  }
}

// ── Task operations ─────────────────────────────────────────────
async function addTask() {
  const input = document.getElementById('new-task');
  const text  = input.value.trim();
  if (!text) return;
  const user = auth.currentUser;
  if (!user || !selectedCat) return;
  input.value = '';
  await addDoc(collection(db, 'users', user.uid, 'tasks'), {
    text,
    done: false,
    status: 'todo',
    cat: selectedCat,
    createdAt: Date.now()
  });
}

async function toggleTask(id) {
  const user    = auth.currentUser;
  const t       = tasks.find(t => t.id === id);
  if (!t || !user) return;
  const newDone = !t.done;
  await updateDoc(doc(db, 'users', user.uid, 'tasks', id), {
    done: newDone,
    status: newDone ? 'done' : 'todo'
  });
}

async function moveTask(id, newStatus) {
  const user = auth.currentUser;
  if (!user) return;
  await updateDoc(doc(db, 'users', user.uid, 'tasks', id), {
    status: newStatus,
    done: newStatus === 'done'
  });
}

function getTaskStatus(t) {
  return t.status ?? (t.done ? 'done' : 'todo');
}

async function deleteTask(id) {
  const user = auth.currentUser;
  if (!user) return;
  await deleteDoc(doc(db, 'users', user.uid, 'tasks', id));
}

async function clearDone() {
  const user = auth.currentUser;
  if (!user) return;
  const batch = writeBatch(db);
  tasks.filter(t => t.done).forEach(t => {
    batch.delete(doc(db, 'users', user.uid, 'tasks', t.id));
  });
  await batch.commit();
}

// ── Category CRUD ─────────────────────────────────────────────────
async function createCategory(name, colorIndex) {
  const trimmed = name.trim();
  if (!trimmed) return { error: 'El nombre no puede estar vacío.' };
  const user = auth.currentUser;
  if (!user) return;
  try {
    await addDoc(collection(db, 'users', user.uid, 'categories'), {
      name: trimmed, colorIndex, createdAt: Date.now()
    });
    editingCatId = null;
  } catch (err) {
    console.error('createCategory error:', err);
    return { error: 'Error al crear la categoría.' };
  }
}

async function updateCategory(id, name, colorIndex) {
  const trimmed = name.trim();
  if (!trimmed) return { error: 'El nombre no puede estar vacío.' };
  const user = auth.currentUser;
  if (!user) return;
  try {
    await updateDoc(doc(db, 'users', user.uid, 'categories', id), {
      name: trimmed, colorIndex
    });
    editingCatId = null;
  } catch (err) {
    console.error('updateCategory error:', err);
    return { error: 'Error al actualizar la categoría.' };
  }
}

async function deleteCategory(id) {
  const user = auth.currentUser;
  if (!user) return;
  const taskCount = tasks.filter(t => t.cat === id).length;
  if (taskCount > 0) return; // bloqueado — renderSettings muestra el mensaje
  const cat = categories.find(c => c.id === id);
  if (!confirm(`¿Eliminar la categoría "${cat ? cat.name : id}"?`)) return;
  if (selectedCat === id) {
    selectedCat = categories.find(c => c.id !== id)?.id || null;
  }
  try {
    await deleteDoc(doc(db, 'users', user.uid, 'categories', id));
  } catch (err) {
    console.error('deleteCategory error:', err);
  }
}

// ── Auth actions ─────────────────────────────────────────────────
async function login() {
  const provider = new GoogleAuthProvider();
  const btn = document.getElementById('login-btn');
  const sub = document.getElementById('login-sub');
  btn.disabled = true;
  sub.textContent = 'Conectando...';
  sub.style.color = '';
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    btn.disabled = false;
    if (err.code === 'auth/popup-blocked') {
      sub.textContent = 'Popup bloqueado, redirigiendo a Google...';
      await signInWithRedirect(auth, provider);
    } else if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
      sub.textContent = 'Cerraste el popup. Intentá de nuevo.';
      sub.style.color = 'var(--muted)';
    } else {
      sub.textContent = `Error: ${err.code}`;
      sub.style.color = 'var(--salud)';
      console.error('Login error:', err.code, err.message);
    }
  }
}

async function logout() {
  await signOut(auth);
}

// ── Settings navigation ───────────────────────────────────────────
function showSettings() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('settings-screen').style.display = '';
  renderSettings();
}

function hideSettings() {
  editingCatId = null;
  document.getElementById('settings-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  render();
}

// ── UI helpers ───────────────────────────────────────────────────
function selectCat(cat) {
  selectedCat = cat;
  renderCatSelector();
}

function setFilter(f) {
  filter = f;
  ['all','pending','done'].forEach(k =>
    document.getElementById('f-' + k).classList.toggle('active', k === f)
  );
  render();
}

function setCatFilter(cat) {
  catFilter = catFilter === cat ? null : cat;
  renderNavCats();
  render();
}

function getCatBadge(catId) {
  const cat = categories.find(c => c.id === catId);
  const cls  = cat ? `cat-p${cat.colorIndex}` : 'cat-p0';
  const lbl  = cat ? escHtml(cat.name) : escHtml(catId);
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function render() {
  const total   = tasks.length;
  const done    = tasks.filter(t => t.done).length;
  const pending = total - done;

  document.getElementById('hcount').textContent  = total ? `(${pending} pendiente${pending !== 1 ? 's' : ''})` : '';
  document.getElementById('counter').textContent = total ? `${done}/${total} listas` : '';
  document.getElementById('clear-btn').style.display = done > 0 ? 'inline-block' : 'none';

  const mainEl = document.querySelector('#app main');
  if (viewMode === 'board') {
    mainEl.classList.add('board-mode');
    document.getElementById('task-list').style.display = 'none';
    document.getElementById('board').style.display = '';
    document.getElementById('board-dots').style.display = '';
    renderBoard();
  } else {
    mainEl.classList.remove('board-mode');
    if (boardDndController) { boardDndController.abort(); boardDndController = null; }
    if (dotsController)     { dotsController.abort();     dotsController     = null; }
    document.getElementById('board').style.display = 'none';
    document.getElementById('board-dots').style.display = 'none';
    document.getElementById('task-list').style.display = '';
    renderList();
  }
}

function renderList() {
  const visible = tasks.filter(t => {
    const sOk = filter === 'all' ? true : filter === 'done' ? t.done : !t.done;
    const cOk = catFilter ? t.cat === catFilter : true;
    return sOk && cOk;
  });

  const list = document.getElementById('task-list');

  if (!visible.length) {
    const msgs = { done: 'ninguna completada aún.', pending: '¡todo al día!', all: 'la lista está vacía.' };
    list.innerHTML = `<div class="empty">${catFilter ? 'nada en esta categoría.' : msgs[filter]}</div>`;
    return;
  }

  list.innerHTML = visible.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}">
      <button class="check-btn ${t.done ? 'done' : ''}" data-action="toggle" data-id="${t.id}" aria-label="${t.done ? 'Marcar pendiente' : 'Completar'}">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2,6 5,9 10,3"/>
        </svg>
      </button>
      <span class="task-text ${t.done ? 'done' : ''}">${escHtml(t.text)}</span>
      ${getCatBadge(t.cat)}
      <button class="del-btn" data-action="delete" data-id="${t.id}" aria-label="Eliminar">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
        </svg>
      </button>
    </div>
  `).join('');
}

const COL_ORDER   = ['todo', 'doing', 'done'];
const COL_NAMES   = { todo: 'Por hacer', doing: 'Haciendo', done: 'Hecho' };
const PREV_STATUS = { todo: null, doing: 'todo', done: 'doing' };
const NEXT_STATUS = { todo: 'doing', doing: 'done', done: null };

const SVG_PREV = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const SVG_NEXT = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
const SVG_DEL  = `<svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>`;

function renderBoard() {
  if (boardDndController) boardDndController.abort();
  if (dotsController)     dotsController.abort();

  const visible = tasks.filter(t => catFilter ? t.cat === catFilter : true);
  const board = document.getElementById('board');

  // Sin tareas visibles: no hay nada para arrastrar — un solo mensaje, no 3 drop zones
  if (!visible.length) {
    const catName = catFilter ? categories.find(c => c.id === catFilter)?.name : null;
    board.innerHTML = `<div class="board-empty-filter">${catName ? `Sin tareas en ${escHtml(catName)}` : 'Sin tareas'}</div>`;
    document.getElementById('board-dots').style.display = 'none';
    return;
  }

  const cols = { todo: [], doing: [], done: [] };
  visible.forEach(t => cols[getTaskStatus(t)].push(t));

  board.innerHTML = COL_ORDER.map(status => {
    const items   = cols[status];
    const isEmpty = items.length === 0;
    const cards = items.length
      ? items.map(t => `
          <div class="board-card" draggable="true" data-id="${t.id}" data-status="${status}">
            <span class="board-card-text">${escHtml(t.text)}</span>
            <div class="board-card-footer">
              ${getCatBadge(t.cat)}
              <div class="board-card-actions">
                <button class="board-card-move-btn" data-action="move-prev" data-id="${t.id}" data-status="${status}"
                        aria-label="Mover atrás" ${!PREV_STATUS[status] ? 'disabled' : ''}>${SVG_PREV}</button>
                <button class="board-card-move-btn" data-action="move-next" data-id="${t.id}" data-status="${status}"
                        aria-label="Mover adelante" ${!NEXT_STATUS[status] ? 'disabled' : ''}>${SVG_NEXT}</button>
                <button class="board-card-del-btn" data-action="delete" data-id="${t.id}" aria-label="Eliminar">${SVG_DEL}</button>
              </div>
            </div>
          </div>
        `).join('')
      : `<div class="board-empty">soltá acá</div>`;
    return `
      <div class="board-col${isEmpty ? ' empty-col' : ''}" data-col-status="${status}" style="flex-grow:${isEmpty ? 1 : 3}">
        <div class="board-col-header">
          <span>${COL_NAMES[status]}</span>
          <span class="board-col-count">${items.length}</span>
        </div>
        <div class="board-col-body">${cards}</div>
      </div>`;
  }).join('');

  initBoardDnd(board);
  initMobileDots(board);
}

function initBoardDnd(board) {
  boardDndController = new AbortController();
  const sig = boardDndController.signal;

  board.addEventListener('dragstart', e => {
    const card = e.target.closest('.board-card');
    if (!card) return;
    dragTaskId = card.dataset.id;
    board.classList.add('dragging-active');
    requestAnimationFrame(() => card.classList.add('dragging'));
  }, { signal: sig });

  board.addEventListener('dragend', e => {
    const card = e.target.closest('.board-card');
    if (card) card.classList.remove('dragging');
    board.classList.remove('dragging-active');
    board.querySelectorAll('.board-col').forEach(c => c.classList.remove('drag-over'));
  }, { signal: sig });

  board.addEventListener('dragover', e => {
    const col = e.target.closest('.board-col');
    if (!col) return;
    e.preventDefault();
    board.querySelectorAll('.board-col').forEach(c => c.classList.remove('drag-over'));
    col.classList.add('drag-over');
  }, { signal: sig });

  board.addEventListener('dragleave', e => {
    const col = e.target.closest('.board-col');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  }, { signal: sig });

  board.addEventListener('drop', e => {
    const col = e.target.closest('.board-col');
    if (!col || !dragTaskId) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    const newStatus = col.dataset.colStatus;
    const t = tasks.find(t => t.id === dragTaskId);
    if (t && getTaskStatus(t) !== newStatus) moveTask(dragTaskId, newStatus);
    dragTaskId = null;
  }, { signal: sig });

  board.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, id, status } = btn.dataset;
    if (action === 'move-prev' && PREV_STATUS[status]) moveTask(id, PREV_STATUS[status]);
    if (action === 'move-next' && NEXT_STATUS[status]) moveTask(id, NEXT_STATUS[status]);
    if (action === 'delete') deleteTask(id);
  }, { signal: sig });
}

function initMobileDots(board) {
  const dotsEl = document.getElementById('board-dots');
  const dots   = dotsEl.querySelectorAll('.board-dot');
  const cols   = board.querySelectorAll('.board-col');
  if (!cols.length) return;

  dotsController = new AbortController();
  const sig = dotsController.signal;

  const onScroll = () => {
    const colW = cols[0].offsetWidth;
    const idx  = Math.round(board.scrollLeft / (colW + 12));
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  };

  board.addEventListener('scroll', onScroll, { passive: true, signal: sig });
  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
      const colW = cols[0]?.offsetWidth || 0;
      board.scrollTo({ left: i * (colW + 12), behavior: 'smooth' });
    }, { signal: sig });
  });
}

function toggleViewMode() {
  viewMode = viewMode === 'list' ? 'board' : 'list';
  localStorage.setItem('viewMode', viewMode);
  updateViewBtn();
  render();
}

function updateViewBtn() {
  const btn    = document.getElementById('view-toggle-btn');
  const isBoard = viewMode === 'board';
  btn.textContent = isBoard ? 'lista' : 'tablero';
  btn.classList.toggle('active', isBoard);
  ['f-all','f-pending','f-done'].forEach(id => {
    document.getElementById(id).style.display = isBoard ? 'none' : '';
  });
  document.getElementById('status-sep').style.display = isBoard ? 'none' : '';
}

// ── Dynamic renders ───────────────────────────────────────────────
function renderCatSelector() {
  const btn   = document.getElementById('cat-select-btn');
  const dot   = document.getElementById('cat-select-dot');
  const label = document.getElementById('cat-select-label');
  if (!btn || !dot || !label) return;
  const cat = categories.find(c => c.id === selectedCat);
  if (cat) {
    btn.classList.add('has-value');
    dot.className = `cat-select-dot cat-p${cat.colorIndex}`;
    label.textContent = cat.name;
    label.title = cat.name;
  } else {
    btn.classList.remove('has-value');
    dot.className = 'cat-select-dot';
    label.textContent = 'Categoría';
    label.removeAttribute('title');
  }
  renderCatMenu();
}

function renderCatMenu() {
  const menu = document.getElementById('cat-menu');
  const btn  = document.getElementById('cat-select-btn');
  if (!menu || !btn) return;
  menu.style.display = catMenuOpen ? '' : 'none';
  btn.setAttribute('aria-expanded', String(catMenuOpen));
  if (!catMenuOpen) return;
  menu.innerHTML = categories.length
    ? categories.map(cat => `
        <button class="cat-menu-item${selectedCat === cat.id ? ' selected' : ''}" type="button" data-cat="${cat.id}">
          <span class="cat-dot cat-p${cat.colorIndex}"></span>
          <span class="cat-menu-name">${escHtml(cat.name)}</span>
          ${selectedCat === cat.id ? '<svg class="cat-menu-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
        </button>
      `).join('')
    : '<div class="cat-menu-empty">sin categorías</div>';
}

function renderNavCats() {
  const nav = document.querySelector('nav');
  if (!nav) return;
  nav.querySelectorAll('[data-cat-filter]').forEach(el => el.remove());
  const viewToggleBtn = document.getElementById('view-toggle-btn');
  const refEl = viewToggleBtn.previousElementSibling; // sep before view toggle
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = `nav-btn cat-pill cat-p${cat.colorIndex}${catFilter === cat.id ? ' active' : ''}`;
    btn.dataset.catFilter = cat.id;
    btn.textContent = cat.name; // textContent — seguro contra XSS
    nav.insertBefore(btn, refEl);
  });
}

function renderCatForm(id, currentName, currentColorIndex) {
  const colors = Array.from({ length: 10 }, (_, i) => `
    <button class="color-dot cat-p${i}${currentColorIndex === i ? ' selected' : ''}"
            data-action="select-color" data-color="${i}" aria-label="Color ${i}"></button>
  `).join('');
  return `
    <div class="cat-row cat-row-form" data-form-id="${id}">
      <input class="cat-form-input" type="text" placeholder="Nombre de la categoría"
             value="${escHtml(currentName)}" data-form-input maxlength="30" autocomplete="off" />
      <div class="color-picker" data-form-id="${id}">${colors}</div>
      <div class="cat-row-actions">
        <button class="icon-btn confirm-btn" data-action="confirm-cat" data-id="${id}" aria-label="Confirmar">
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="2,6 5,9 10,3"/>
          </svg>
        </button>
        <button class="icon-btn" data-action="cancel-cat" aria-label="Cancelar">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  `;
}

function renderSettings() {
  const list = document.getElementById('categories-list');
  if (!list) return;
  if (!categories.length) {
    list.innerHTML = '<div class="settings-empty">sin categorías. usá + para crear la primera.</div>';
    if (editingCatId === 'new') list.insertAdjacentHTML('beforeend', renderCatForm('new', '', 0));
    return;
  }
  list.innerHTML = categories.map(cat => {
    if (editingCatId === cat.id) return renderCatForm(cat.id, cat.name, cat.colorIndex);
    const taskCount = tasks.filter(t => t.cat === cat.id).length;
    const isBlocked = taskCount > 0;
    return `
      <div class="cat-row" data-cat-id="${cat.id}">
        <span class="cat-dot cat-p${cat.colorIndex}"></span>
        <span class="cat-name">${escHtml(cat.name)}</span>
        <div class="cat-row-actions">
          <button class="icon-btn" data-action="edit-cat" data-id="${cat.id}" aria-label="Editar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          ${isBlocked
            ? `<button class="icon-btn blocked" aria-disabled="true" aria-label="No se puede eliminar">
                 <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                   <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
                 </svg>
               </button>`
            : `<button class="icon-btn" data-action="delete-cat" data-id="${cat.id}" aria-label="Eliminar">
                 <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                   <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
                 </svg>
               </button>`
          }
        </div>
        ${isBlocked ? `<div class="cat-blocked-msg">${taskCount} tarea${taskCount !== 1 ? 's' : ''} asociada${taskCount !== 1 ? 's' : ''} — reasigná o eliminá las tareas primero</div>` : ''}
      </div>
    `;
  }).join('');
  if (editingCatId === 'new') list.insertAdjacentHTML('beforeend', renderCatForm('new', '', 0));
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Event wiring ─────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('add-btn').addEventListener('click', addTask);
document.getElementById('new-task').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
document.getElementById('clear-btn').addEventListener('click', clearDone);

document.getElementById('f-all').addEventListener('click',     () => setFilter('all'));
document.getElementById('f-pending').addEventListener('click', () => setFilter('pending'));
document.getElementById('f-done').addEventListener('click',    () => setFilter('done'));

// Nav: delegación — los botones de categoría son dinámicos
document.querySelector('nav').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat-filter]');
  if (btn) setCatFilter(btn.dataset.catFilter);
});

document.getElementById('cat-select-btn').addEventListener('click', e => {
  e.stopPropagation();
  catMenuOpen = !catMenuOpen;
  renderCatMenu();
});

document.getElementById('cat-menu').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  selectCat(btn.dataset.cat);
  catMenuOpen = false;
  renderCatMenu();
});

document.addEventListener('click', e => {
  if (catMenuOpen && !e.target.closest('.input-wrap')) {
    catMenuOpen = false;
    renderCatMenu();
  }
});

document.getElementById('task-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;
  if (action === 'toggle') toggleTask(id);
  if (action === 'delete') deleteTask(id);
});

// Settings: navegación
document.getElementById('settings-btn').addEventListener('click', showSettings);
document.getElementById('settings-back-btn').addEventListener('click', hideSettings);

// Settings: agregar categoría
document.getElementById('add-category-btn').addEventListener('click', () => {
  editingCatId = 'new';
  renderSettings();
  const input = document.querySelector('[data-form-input]');
  if (input) input.focus();
});

// Settings: delegación en lista de categorías
document.getElementById('categories-list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;

  if (action === 'edit-cat') {
    editingCatId = id;
    renderSettings();
    const input = document.querySelector('[data-form-input]');
    if (input) { input.focus(); input.select(); }
    return;
  }

  if (action === 'delete-cat') {
    await deleteCategory(id);
    renderSettings();
    return;
  }

  if (action === 'cancel-cat') {
    editingCatId = null;
    renderSettings();
    return;
  }

  if (action === 'select-color') {
    const colorIndex = parseInt(btn.dataset.color, 10);
    const picker = btn.closest('[data-form-id]');
    if (picker) {
      picker.querySelectorAll('.color-dot').forEach(dot => {
        dot.classList.toggle('selected', parseInt(dot.dataset.color, 10) === colorIndex);
      });
    }
    return;
  }

  if (action === 'confirm-cat') {
    const formEl = btn.closest('.cat-row-form');
    if (!formEl) return;
    const input      = formEl.querySelector('[data-form-input]');
    const selectedDot = formEl.querySelector('.color-dot.selected');
    const name       = input ? input.value : '';
    const colorIndex = selectedDot ? parseInt(selectedDot.dataset.color, 10) : 0;

    if (!name.trim()) {
      let errEl = formEl.querySelector('.cat-error');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.className = 'cat-error';
        formEl.appendChild(errEl);
      }
      errEl.textContent = 'El nombre no puede estar vacío.';
      if (input) input.focus();
      return;
    }

    const result = id === 'new'
      ? await createCategory(name, colorIndex)
      : await updateCategory(id, name, colorIndex);

    if (result?.error) {
      let errEl = formEl.querySelector('.cat-error');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.className = 'cat-error';
        formEl.appendChild(errEl);
      }
      errEl.textContent = result.error;
      return;
    }
    renderSettings();
    return;
  }
});

document.getElementById('view-toggle-btn').addEventListener('click', toggleViewMode);
updateViewBtn();

// ── Theme toggle ─────────────────────────────────────────────────
const SUN  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function updateThemeBtn() {
  const isDark = document.documentElement.dataset.theme !== 'light';
  document.getElementById('theme-btn').innerHTML = isDark ? SUN : MOON;
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  updateThemeBtn();
}

updateThemeBtn();
document.getElementById('theme-btn').addEventListener('click', toggleTheme);
</script>
